<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 280px; font-family: Arial, sans-serif; padding: 15px; }
    h2 { font-size: 18px; color: #333; margin-top: 0; }
    input { width: 90%; padding: 8px; margin-bottom: 10px; }
    button { width: 98%; padding: 8px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #result { margin-top: 15px; padding: 10px; border-radius: 4px; font-weight: bold; }
    .safe { background: #dcfce7; color: #166534; }
    .danger { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <h2>ScamGuard Link Checker</h2>
  <input type="text" id="urlInput" placeholder="Paste link here to check...">
  <button id="checkBtn">Check Link</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
